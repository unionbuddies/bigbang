<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The nine stages of the Big Bang, from the singularity to the first stars — an animated cosmological sequence.">
<title>The Big Bang — Nine Stages of Everything</title>

<style>
  @property --accent {
    syntax: "<color>";
    inherits: true;
    initial-value: #C39BFF;
  }

  :root {
    --void:      #04050A;
    --void-2:    #080A12;
    --ink:       #EDE9E2;
    --ink-dim:   #98A0B2;
    --ink-faint: #59617440;

    --accent: #C39BFF;
    --glow:  color-mix(in oklab, var(--accent) 22%, transparent);
    --wash:  color-mix(in oklab, var(--accent) 10%, transparent);

    --display: "Futura", "Avenir Next", "Century Gothic", "URW Gothic", "Questrial", system-ui, sans-serif;
    --serif:   "Iowan Old Style", "Charter", "Palatino Linotype", "Palatino", Georgia, serif;
    --mono:    ui-monospace, "SF Mono", "IBM Plex Mono", "Roboto Mono", Menlo, monospace;

    color-scheme: dark;
    transition: --accent 1400ms cubic-bezier(.4,0,.2,1);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--void);
    color: var(--ink);
    font-family: var(--serif);
    overflow: hidden;
  }

  /* ---------- stage ---------- */

  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(120% 90% at 50% 42%, transparent 34%, rgba(4,5,10,.62) 100%),
      linear-gradient(to top, rgba(4,5,10,.97) 0%, rgba(4,5,10,.94) 22%, rgba(4,5,10,.72) 40%, transparent 68%),
      linear-gradient(to right, rgba(4,5,10,.86) 0%, rgba(4,5,10,.42) 38%, transparent 66%);
  }

  .shell {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(20px, 3.2vw, 46px);
    pointer-events: none;
  }
  .shell > * { pointer-events: auto; }

  /* ---------- masthead ---------- */

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
  }

  .mark {
    font-family: var(--display);
    font-size: clamp(11px, 1.05vw, 13px);
    letter-spacing: .34em;
    text-transform: uppercase;
    color: var(--ink-dim);
    line-height: 1.9;
  }
  .mark b {
    display: block;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: .22em;
  }

  .tel {
    display: grid;
    gap: 7px;
    justify-items: end;
    min-width: 210px;
  }
  .tel-row {
    display: grid;
    grid-template-columns: auto auto;
    align-items: baseline;
    gap: 14px;
    width: 100%;
    justify-content: end;
  }
  .tel .k {
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #5C6478;
  }
  .tel .v {
    font-family: var(--mono);
    font-size: clamp(11px, 1.1vw, 13px);
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    text-align: right;
    min-width: 130px;
    transition: color 1200ms ease;
  }

  /* ---------- narration ---------- */

  main {
    display: flex;
    align-items: flex-end;
    padding-bottom: clamp(14px, 3vh, 34px);
    min-height: 0;                       /* lets .copy scroll instead of pushing the rail off */
  }

  .copy {
    max-width: 52ch;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    max-height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 12px;
    scrollbar-width: thin;
    scrollbar-color: color-mix(in oklab, var(--accent) 45%, transparent) transparent;
  }
  .copy::-webkit-scrollbar { width: 3px; }
  .copy::-webkit-scrollbar-track { background: transparent; }
  .copy::-webkit-scrollbar-thumb {
    background: color-mix(in oklab, var(--accent) 45%, transparent);
    border-radius: 2px;
  }

  .copy > * {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 900ms cubic-bezier(.2,.6,.2,1), transform 900ms cubic-bezier(.2,.6,.2,1);
  }
  .copy.in > *          { opacity: 1; transform: none; }
  .copy.in .eyebrow     { transition-delay: 60ms; }
  .copy.in .title       { transition-delay: 220ms; }
  .copy.in .lede        { transition-delay: 480ms; }
  .copy.in .yield       { transition-delay: 760ms; }
  .copy.in .more        { transition-delay: 900ms; }
  .copy.in .deep        { transition-delay: 0ms; }
  .copy.out > *         { opacity: 0; transform: translateY(-10px); transition-duration: 620ms; transition-delay: 0ms; }

  /* reading mode: the headline yields space to the detail while the panel is open */
  .copy .title {
    transition: opacity 900ms cubic-bezier(.2,.6,.2,1),
                transform 900ms cubic-bezier(.2,.6,.2,1),
                font-size 340ms ease, margin-bottom 340ms ease;
  }
  .copy.reading .eyebrow { margin-bottom: 12px; }
  .copy.reading .title   { font-size: clamp(1.7rem, 3.1vw, 2.5rem); margin-bottom: 14px; }
  .copy.reading .lede    { font-size: clamp(.94rem, 1.2vw, 1.02rem); }
  .copy.reading .more    { margin-top: 18px; }

  /* ---------- glossary ---------- */

  .term {
    font: inherit;
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    cursor: help;
    color: color-mix(in oklab, var(--ink) 80%, var(--accent));
    border-bottom: 1px dotted color-mix(in oklab, var(--accent) 65%, transparent);
    transition: color 220ms ease, border-color 220ms ease;
  }
  .term:hover,
  .term:focus-visible { color: var(--accent); border-bottom-color: var(--accent); }
  .term:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; border-radius: 1px; }

  .tip {
    position: fixed;
    z-index: 50;
    max-width: 32ch;
    background: #0D1018;
    border: 1px solid #2C3444;
    border-left: 2px solid var(--accent);
    color: #CFD4DE;
    font-family: var(--serif);
    font-size: 13.5px;
    line-height: 1.52;
    padding: 11px 14px;
    box-shadow: 0 14px 38px rgba(0,0,0,.66);
    opacity: 0;
    visibility: hidden;
    transform: translateY(4px);
    transition: opacity 170ms ease, transform 170ms ease, visibility 170ms;
    pointer-events: none;
  }
  .tip.on { opacity: 1; visibility: visible; transform: none; }

  /* ---------- deep dive ---------- */

  .more {
    align-self: flex-start;
    flex: none;
    margin-top: 24px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    font-family: var(--display);
    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--accent);
    transition: opacity 220ms ease;
  }
  .more:hover { opacity: .72; }
  .more:focus-visible { outline: 1px solid var(--accent); outline-offset: 5px; }
  .more .chev {
    width: 6px; height: 6px;
    border-right: 1px solid currentColor;
    border-bottom: 1px solid currentColor;
    transform: rotate(45deg);
    margin-top: -3px;
    transition: transform 300ms cubic-bezier(.2,.6,.2,1), margin 300ms ease;
  }
  .more[aria-expanded="true"] .chev { transform: rotate(-135deg); margin-top: 2px; }

  .deep {
    margin-top: 20px;
    padding-left: 20px;
    padding-right: 14px;
    border-left: 1px solid color-mix(in oklab, var(--accent) 38%, transparent);
    max-width: 46ch;
    display: grid;
    gap: 13px;
    font-size: clamp(.9rem, 1.15vw, .97rem);
    line-height: 1.72;
    color: #A4AAB9;
    /* takes whatever height is left over and scrolls inside itself, so the
       title and lede never leave the screen and only one thing ever scrolls */
    flex: 0 1 auto;
    min-height: 0;
    overflow-y: auto;
    /* soft bottom edge so the cut-off reads as "more below", not as clipping */
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent 100%);
    mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent 100%);
    scrollbar-width: thin;
    scrollbar-color: color-mix(in oklab, var(--accent) 45%, transparent) transparent;
  }
  .deep::-webkit-scrollbar { width: 3px; }
  .deep::-webkit-scrollbar-track { background: transparent; }
  .deep::-webkit-scrollbar-thumb {
    background: color-mix(in oklab, var(--accent) 45%, transparent);
    border-radius: 2px;
  }
  /* author `display` beats the UA's [hidden] rule, so restore it explicitly */
  .deep[hidden] { display: none; }
  .deep p { margin: 0; }
  .deep strong { color: #D4D9E2; font-weight: 400; }
  .deep:not([hidden]) { animation: deepIn 420ms cubic-bezier(.2,.6,.2,1); }
  @keyframes deepIn { from { opacity: 0; transform: translateY(-8px); } }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: var(--display);
    font-size: clamp(10px, .95vw, 12px);
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 20px;
  }
  .eyebrow .idx {
    font-family: var(--mono);
    letter-spacing: .06em;
    color: var(--accent);
    transition: color 1200ms ease;
  }
  .eyebrow .bar {
    flex: 0 0 34px;
    height: 1px;
    background: linear-gradient(to right, var(--accent), transparent);
    transition: background 1200ms ease;
  }

  .title {
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(2.4rem, 6.4vw, 4.9rem);
    line-height: .96;
    letter-spacing: -.02em;
    text-wrap: balance;
    margin: 0 0 22px;
    color: var(--ink);
    text-shadow: 0 0 68px var(--glow);
  }

  .lede {
    font-size: clamp(1rem, 1.42vw, 1.17rem);
    line-height: 1.66;
    color: #C3C8D2;
    margin: 0;
    max-width: 46ch;
  }

  .yield {
    margin: 26px 0 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    border-top: 1px solid #2A3040;
  }
  .yield li {
    padding: 14px 26px 0 0;
    margin-right: 26px;
    border-right: 1px solid #2A3040;
  }
  .yield li:last-child { border-right: 0; margin-right: 0; padding-right: 0; }
  .yield .el {
    display: block;
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #5C6478;
    margin-bottom: 5px;
  }
  .yield .amt {
    font-family: var(--mono);
    font-size: clamp(.95rem, 1.3vw, 1.1rem);
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    transition: color 1200ms ease;
  }

  /* ---------- transport ---------- */

  footer {
    display: grid;
    gap: 15px;
  }

  .rail {
    display: grid;
    grid-template-columns: repeat(var(--n, 9), 1fr);
    gap: 6px;
  }

  .node {
    appearance: none;
    -webkit-appearance: none;
    background: none;
    border: 0;
    padding: 13px 0 0;
    margin: 0;
    text-align: left;
    cursor: pointer;
    font: inherit;
    color: inherit;
    position: relative;
    border-top: 1px solid #262C3A;
    transition: border-color 500ms ease;
  }
  .node::after {
    content: "";
    position: absolute;
    top: -1px; left: 0;
    height: 1px;
    width: 0;
    background: var(--accent);
    transition: width 120ms linear, background 1200ms ease;
  }
  .node.done::after { width: 100%; transition: width 500ms ease, background 1200ms ease; }

  .node .nn {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    color: #4E566A;
    margin-bottom: 4px;
    font-variant-numeric: tabular-nums;
    transition: color 500ms ease;
  }
  .node .nl {
    display: block;
    font-family: var(--display);
    font-size: clamp(9px, .82vw, 11px);
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #626A7E;
    line-height: 1.45;
    transition: color 500ms ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .node:hover .nl,
  .node:focus-visible .nl { color: var(--ink); }
  .node.active .nn { color: var(--accent); }
  .node.active .nl { color: var(--ink); }
  .node:focus-visible { outline: 1px solid var(--accent); outline-offset: 5px; }

  .transport {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .btn {
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    border: 1px solid #2C3342;
    border-radius: 999px;
    color: var(--ink-dim);
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
    padding: 9px 18px;
    cursor: pointer;
    transition: color 260ms ease, border-color 260ms ease, background 260ms ease;
  }
  .btn:hover, .btn:focus-visible {
    color: var(--ink);
    border-color: var(--accent);
    background: var(--wash);
  }
  .btn:focus-visible { outline: none; }

  .elapsed {
    font-family: var(--mono);
    font-size: 11px;
    color: #4E566A;
    font-variant-numeric: tabular-nums;
    margin-left: auto;
  }

  /* ---------- responsive ---------- */

  @media (max-width: 900px) {
    .tel { min-width: 0; }
    .tel .v { min-width: 96px; font-size: 11px; }
    .copy { max-width: none; }
    .rail { gap: 4px; }
    .node .nl { display: none; }
    .node { padding-top: 9px; }
  }

  @media (max-width: 600px) {
    header { flex-direction: column; gap: 14px; }
    .tel { justify-items: start; }
    .tel-row { justify-content: start; grid-template-columns: 92px auto; gap: 10px; }
    .tel .v { text-align: left; }
    main { padding-top: 12px; }
    .lede { font-size: .98rem; line-height: 1.6; }
    .yield li { padding-right: 16px; margin-right: 16px; }
    .elapsed { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .copy > * { transition-duration: 420ms; transform: none !important; }
  }
</style>

</head>
<body>
<canvas id="sky"></canvas>
<div class="vignette"></div>

<div class="shell">
  <header>
    <div class="mark">
      <b>The Big Bang</b>
      Nine stages of everything
    </div>
    <div class="tel">
      <div class="tel-row"><span class="k">Cosmic time</span><span class="v" id="tTime">t = 0</span></div>
      <div class="tel-row"><span class="k">Temperature</span><span class="v" id="tTemp">&gt; 10³² K</span></div>
      <div class="tel-row"><span class="k">State</span><span class="v" id="tState">Singularity</span></div>
    </div>
  </header>

  <main>
    <div class="copy" id="copy"></div>
  </main>

  <footer>
    <div class="rail" id="rail"></div>
    <div class="transport">
      <button class="btn" id="playBtn" type="button">Pause</button>
      <button class="btn" id="replayBtn" type="button">Replay</button>
      <span class="elapsed" id="elapsed">Stage 1 / 8</span>
    </div>
  </footer>
</div>

<script>
(() => {
  "use strict";

  const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;

  /* ============================ content ============================ */

  /* definitions surfaced on hover / tap / keyboard focus */
  const GLOSSARY = {
    singularity: "A point of infinite density where the known laws of physics stop producing meaningful answers.",
    inflation: "A brief burst of exponential expansion in the universe's first fraction of a second, stretching space far faster than light can travel through it.",
    quark: "A fundamental particle that cannot exist alone. Three of them, bound by the strong force, make a proton or a neutron.",
    strong: "The strongest of the four fundamental forces. It binds quarks into nucleons and holds atomic nuclei together against the electrical repulsion of their protons.",
    antimatter: "Matter's mirror image — identical mass, opposite charge. When matter and antimatter meet they annihilate into pure energy.",
    fusion: "Light atomic nuclei slamming together hard enough to form a heavier one, releasing energy. It powers every star.",
    nucleus: "The dense core of an atom, made of protons and neutrons. It carries almost all the atom's mass.",
    recombination: "The moment nuclei captured free electrons to form complete neutral atoms, releasing light to travel freely for the first time.",
    cmb: "Cosmic Microwave Background — the oldest light in existence, released at recombination and still arriving from every direction in the sky.",
    reionization: "The era when ultraviolet light from the first stars stripped electrons back off the universe's neutral hydrogen.",
    supernova: "The explosive death of a massive star — the event that forges most heavy elements and scatters them into space.",
    darkenergy: "The unexplained influence causing cosmic expansion to accelerate. It accounts for roughly 68% of everything in the universe."
  };

  const gl = (key, text) => `<button type='button' class='term' data-g='${key}'>${text}</button>`;

  const STAGES = [
    {
      n: "01", name: "The Singularity", label: "Singularity",
      time: "t = 0", temp: "> 10³² K", state: "Singularity",
      body: `Before the Big Bang, space, time, matter and energy did not exist as we know them. The entire universe was packed into a single point called a ${gl("singularity", "singularity")} — infinitely small, infinitely dense, and unimaginably hot.`,
      deep: `<p>“Singularity” is less a description of an object than a marker for where our theories break down. General relativity, which governs gravity and the very large, predicts infinite density here. Quantum mechanics, which governs the very small, cannot be reconciled with it at that scale.</p>
             <p>We have no working theory of quantum gravity, so physics genuinely cannot describe t = 0 itself. The Big Bang model properly begins an instant <strong>after</strong> — at the Planck time, roughly 10⁻⁴³ seconds.</p>
             <p>This is also why “what came before the Big Bang?” may be a malformed question. If time itself began here, there is no “before” for it to refer to.</p>`,
      accent: "#C39BFF", dur: 12000, sim: 0
    },
    {
      n: "02", name: "Cosmic Inflation", label: "Inflation",
      time: "10⁻³⁶ s", temp: "≈ 10²⁷ K", state: "Exponential expansion",
      body: `A fraction of a second in, the universe underwent a super-charged growth spurt called ${gl("inflation", "cosmic inflation")}. Space itself expanded exponentially — from smaller than a subatomic particle to roughly the size of a soccer ball. The stretching smoothed the universe out and spread its energy evenly.`,
      deep: `<p>Alan Guth proposed inflation in 1980 to solve three problems the standard model could not.</p>
             <p><strong>The horizon problem:</strong> opposite sides of the sky sit at the same temperature, despite never having been close enough to exchange heat. <strong>The flatness problem:</strong> the geometry of space is suspiciously, precisely flat. <strong>The monopole problem:</strong> theory predicts magnetic monopoles that nobody can find.</p>
             <p>Inflation answers all three at once. Regions now impossibly far apart really were in contact before the stretch; the expansion flattened the geometry and diluted exotic relics to nothing.</p>
             <p>This expansion was faster than light — which is permitted. Nothing travelled <strong>through</strong> space faster than light; space itself expanded, and that carries no speed limit.</p>`,
      accent: "#7FE9FF", dur: 12500, sim: 1
    },
    {
      n: "03", name: "Energy Turns to Matter", label: "Matter",
      time: "10⁻¹² s", temp: "≈ 10¹⁵ K", state: "Energy → matter",
      body: "As inflation ended the expansion slowed, but the universe was still ferociously hot and filled with pure energy. As it began to cool, that energy transformed into physical matter.",
      deep: `<p>This is E = mc² running in reverse of the way it is usually quoted. Colliding photons produced pairs of particles — one of matter, one of ${gl("antimatter", "antimatter")} — which promptly annihilated back into photons.</p>
             <p>As the universe cooled, production stopped but annihilation carried on. By rights matter and antimatter should have cancelled out exactly, leaving a universe of nothing but light.</p>
             <p>Instead, roughly one particle in a billion survived. That faint asymmetry — called baryogenesis — is every atom that has ever existed, including all of yours. Why it happened remains one of the great unsolved problems in physics.</p>`,
      accent: "#FFD27A", dur: 11500, sim: 2
    },
    {
      n: "04", name: "The Particle Soup", label: "Particle soup",
      time: "1 s", temp: "≈ 10¹⁰ K", state: "Quarks bind into nucleons",
      body: `The universe was a searing, dense soup of fundamental particles — ${gl("quark", "quarks")} and electrons. As it cooled further, gravity and the ${gl("strong", "strong nuclear force")} pulled the quarks together, binding them in groups of three to form the first protons and neutrons.`,
      deep: `<p>Before this, quarks and gluons roamed freely as a state of matter called quark–gluon plasma. Physicists recreate it today by colliding heavy ions at the LHC and RHIC — briefly making the hottest matter ever produced on Earth.</p>
             <p>Below about 10¹² K, a property called colour confinement set in, and quarks could no longer exist alone. They have been locked inside larger particles ever since.</p>
             <p>The recipe is simple: a proton is two up quarks and one down. A neutron is one up and two down. That single swap is the whole difference between the two.</p>
             <p>The strong force behaves unlike any other — it grows <strong>stronger</strong> with distance, like a rubber band. Pull two quarks apart hard enough and the energy creates a new pair rather than letting either go free.</p>`,
      accent: "#FF9E6B", dur: 13500, sim: 3
    },
    {
      n: "05", name: "Cosmic Cooking", label: "Nucleosynthesis",
      time: "≈ 180 s", temp: "≈ 10⁹ K", state: "Nucleosynthesis",
      body: `The whole universe behaved like a giant nuclear reactor. Protons and neutrons smashed together and ${gl("fusion", "fused")}, forging the ${gl("nucleus", "nuclei")} of the very first elements.`,
      yield: [["Hydrogen", "≈ 75%"], ["Helium", "≈ 25%"], ["Lithium", "trace"]],
      deep: `<p>The whole process lasted about twenty minutes. The window was tight — the universe had to stay hot enough to fuse nuclei, but expansion was cooling it rapidly.</p>
             <p>It stopped where it did for a specific reason: there is no stable nucleus with a mass of 5 or 8. That gap blocks the road to heavier elements, so the universe froze at hydrogen, helium and a trace of lithium.</p>
             <p>The predicted helium fraction of about 24% matches what astronomers actually measure, across widely separated parts of the sky. It is one of the strongest pieces of evidence the Big Bang model has.</p>
             <p>Every element heavier than lithium — the carbon in your cells, the oxygen you breathe, the iron in your blood — had to wait for stars.</p>`,
      accent: "#FFB454", dur: 14500, sim: 4
    },
    {
      n: "06", name: "Clear Skies, First Light", label: "First light",
      time: "380,000 yr", temp: "≈ 3,000 °C", state: "Recombination",
      body: `Until now the universe was an opaque, glowing fog — free electrons scattered light and stopped it travelling. Once the temperature fell to about 3,000 °C, the nuclei finally captured those electrons to form complete, neutral atoms. The fog cleared instantly and light flashed across the universe for the first time. We still detect that ancient light today as the ${gl("cmb", "Cosmic Microwave Background")}.`,
      deep: `<p>Physicists call this ${gl("recombination", "recombination")}, which is a misnomer — the electrons and nuclei had never been combined before.</p>
             <p>The afterglow was found by accident. In 1965 Arno Penzias and Robert Wilson could not clear a persistent hiss from their antenna, and suspected the pigeons nesting inside it. The hiss turned out to be the oldest light in the universe, and won them a Nobel Prize.</p>

  /* ============================ canvas ============================ */

  const cv = document.getElementById("sky");
  const ctx = cv.getContext("2d", { alpha: false });
  let W = 0, H = 0, CX = 0, CY = 0, R = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width = W + "px";
    cv.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2;
    CY = H / 2;
    R = Math.hypot(W, H) / 2;
    if (stage >= 0) initSim(stage);
  }

  /* pre-rendered radial glow sprites — far cheaper than shadowBlur */
  const sprites = new Map();
  function sprite(rgb) {
    const key = rgb[0] + "," + rgb[1] + "," + rgb[2];
    let s = sprites.get(key);
    if (s) return s;
    const size = 64, c = document.createElement("canvas");
    c.width = c.height = size;
    const g = c.getContext("2d");
    const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grd.addColorStop(0.00, `rgba(${key},1)`);
    grd.addColorStop(0.18, `rgba(${key},.80)`);
    grd.addColorStop(0.45, `rgba(${key},.24)`);
    grd.addColorStop(1.00, `rgba(${key},0)`);
    g.fillStyle = grd;
    g.fillRect(0, 0, size, size);
    sprites.set(key, c);
    return c;
  }

  function blob(x, y, rad, rgb, alpha) {
    const s = sprite(rgb);
    ctx.globalAlpha = alpha;
    ctx.drawImage(s, x - rad, y - rad, rad * 2, rad * 2);
    ctx.globalAlpha = 1;
  }

  const hexRgb = h => [
    parseInt(h.slice(1, 3), 16),
    parseInt(h.slice(3, 5), 16),
    parseInt(h.slice(5, 7), 16)
  ];
  const rnd  = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn  = t => t * t * t;
  const smooth  = t => t * t * (3 - 2 * t);

  const WHITE  = [255, 246, 232];
  const NEUTRON= [150, 160, 180];

  /* ============================ particles ============================ */

  let P = [];
  let accentRgb = hexRgb(STAGES[0].accent);
  let flash = 0;

  function initSim(i) {
    const s = STAGES[i];

    P = [];
    flash = 0;
    const scale = Math.min(W, H);

    switch (s.sim) {

      /* 0 — singularity: everything spiralling into one point */
      case 0:
        for (let k = 0; k < 460; k++) {
          P.push({
            ang: rnd(0, TAU),
            rad: rnd(0.06, 1.05) * R,
            sp:  rnd(0.55, 1.6),
            sz:  rnd(0.7, 2.1),
            a:   rnd(0.18, 0.7)
          });
        }
        break;

      /* 1 — inflation: exponential runaway from a point, then smoothing */
      case 1:
        for (let k = 0; k < 620; k++) {
          const ang = rnd(0, TAU);
          P.push({
            ang,
            r0:  rnd(0.15, 1) * 0.0006 * R,
            px: CX, py: CY,
            ex:  CX + Math.cos(ang) * rnd(0.05, 0.95) * R * 0.78,
            ey:  CY + Math.sin(ang) * rnd(0.05, 0.95) * R * 0.78,

          P.push({
            x: CX + Math.cos(ang) * d,
            y: CY + Math.sin(ang) * d * 0.72,
            dir: ang + rnd(-0.35, 0.35),        /* radiating outward, not random noise */
            len: rnd(22, 64) * (scale / 900),
            sz:  rnd(0.8, 1.8),
            ph:  rnd(0, TAU),
            sp:  rnd(0.4, 1.3),
            a:   rnd(0.18, 0.5)

      /* 5 — recombination: fog clears, first light escapes */
      case 5: {
        for (let k = 0; k < 200; k++) {
          const ang = rnd(0, TAU);
          const d = Math.sqrt(Math.random()) * R * 0.92;
          P.push({
            kind: "nuc",
            x: CX + Math.cos(ang) * d, y: CY + Math.sin(ang) * d * 0.74,
            sz: rnd(1.6, 2.7)
          });
        }
        for (let k = 0; k < 260; k++) {
          const ang = rnd(0, TAU);
          const d = Math.sqrt(Math.random()) * R * 0.95;
          P.push({
            kind: "el",
            x: CX + Math.cos(ang) * d, y: CY + Math.sin(ang) * d * 0.74,
            vx: rnd(-3.4, 3.4), vy: rnd(-3.4, 3.4),
            host: k % 200,

          });
        }
        for (let k = 0; k < 46; k++) {
          P.push({
            kind: "cmb",
            x: rnd(0, W), y: rnd(0, H),
            rad: rnd(70, 230),
            warm: Math.random() > 0.5,
            ph: rnd(0, TAU)
          });
        }
        break;
      }

      /* 6 — dark ages: invisible gas, almost nothing to see */
      case 6:
        for (let k = 0; k < 22; k++) {
          P.push({
            kind: "gas",
            x: rnd(-0.1, 1.1) * W, y: rnd(-0.1, 1.1) * H,
            rad: rnd(140, 380),
            vx: rnd(-0.09, 0.09), vy: rnd(-0.06, 0.06),
            a: rnd(0.03, 0.085), ph: rnd(0, TAU)
          });
        }
        for (let k = 0; k < 90; k++) {
          P.push({ kind: "dust", x: rnd(0, W), y: rnd(0, H), sz: rnd(0.4, 0.9), a: rnd(0.03, 0.12), ph: rnd(0, TAU) });

      /* 7 — first stars ignite out of collapsing clouds */
      case 7:
        for (let k = 0; k < 30; k++) {

            kind: "cloud",
            x: rnd(0.04, 0.96) * W, y: rnd(0.05, 0.95) * H,

            at: rnd(0.10, 0.80),
            ph: rnd(0, TAU)
          });
        }
        for (let k = 0; k < 340; k++) {
          P.push({
            kind: "star",
            x: rnd(0, W), y: rnd(0, H),
            sz: rnd(0.5, 1.9),
            at: rnd(0.3, 1),
            ph: rnd(0, TAU)
          });
        }
        break;

      /* 8 — a settled universe of galaxies, still drifting apart */
      case 8: {
        for (let k = 0; k < 13; k++) {
          const rad = rnd(95, 230) * (scale / 900);
          const pts = [];
          const N = 190, ARMS = 2;
          for (let j = 0; j < N; j++) {
            const f = (j + 6) / N;
            pts.push({
              th: f * 3.6 + (j % ARMS) * (TAU / ARMS) + rnd(-0.16, 0.16),
              rr: Math.pow(f, 0.72) * rad,
              sz: rnd(0.7, 2.3)
            });
          }
          P.push({
            kind: "gal",
            x: rnd(0.05, 0.95) * W, y: rnd(0.06, 0.94) * H,
            rad, pts,
            rot: rnd(0, TAU),
            tilt: rnd(0.28, 0.85),
            sp: rnd(0.0016, 0.0052) * (Math.random() > 0.5 ? 1 : -1),
            at: rnd(0, 0.45)
          });
        }
        for (let k = 0; k < 240; k++) {
          P.push({
            kind: "fs",
            x: rnd(0, W), y: rnd(0, H),
            sz: rnd(0.4, 1.4), a: rnd(0.2, 0.7), ph: rnd(0, TAU)
          });
        }
        break;
      }
    }
  }

  /* ============================ per-stage rendering ============================ */

  function render(sim, t, now) {
    /* trails: partial clear rather than full wipe */
    const trail = [0.20, 0.13, 0.22, 0.30, 0.30, 0.28, 0.45, 0.22, 0.30][sim];
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = `rgba(4,5,10,${trail})`;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";

    const A = accentRgb;
    const scale = Math.min(W, H);

    switch (sim) {

      case 0: {                                     /* singularity */
        for (const p of P) {
          p.ang += (0.0016 + 0.02 * (1 - p.rad / R)) * p.sp;
          p.rad -= (0.4 + t * 3.4) * p.sp;
          if (p.rad < 3) { p.rad = R * rnd(0.75, 1.1); p.ang = rnd(0, TAU); }
          const x = CX + Math.cos(p.ang) * p.rad;
          const y = CY + Math.sin(p.ang) * p.rad * 0.78;
          const near = 1 - clamp01(p.rad / R);
          blob(x, y, p.sz * (1 + near * 2.6), A, p.a * (0.25 + near * 0.75) * (0.5 + t * 0.5));
        }
        const core = 5 + Math.pow(t, 2.2) * scale * 0.055;
        const puls = 1 + Math.sin(now * 0.0032) * 0.07;
        blob(CX, CY, core * 3.4 * puls, A, 0.26 + t * 0.26);
        blob(CX, CY, core * puls, WHITE, 0.8);
        blob(CX, CY, core * 0.3, [255, 255, 255], 1);
        break;
      }

      case 1: {                                     /* inflation */
        const a = Math.pow(2, easeOut(t) * 11.2);          /* scale factor */
        const settle = clamp01((t - 0.62) / 0.38);
        for (const p of P) {
          const r = Math.min(p.r0 * a, R * 1.25);
          let x = CX + Math.cos(p.ang) * r;
          let y = CY + Math.sin(p.ang) * r * 0.8;
          if (settle > 0) {                                 /* smoothed, even distribution */
            const s = smooth(settle);
            x = lerp(x, p.ex, s);
            y = lerp(y, p.ey, s);
          }
          ctx.strokeStyle = `rgba(${A[0]},${A[1]},${A[2]},${p.a * 0.5 * (1 - settle * 0.65)})`;
          ctx.lineWidth = p.sz * 0.7;
          ctx.beginPath();
          ctx.moveTo(p.px, p.py);
          ctx.lineTo(x, y);
          ctx.stroke();
          blob(x, y, p.sz * (1.6 + settle * 1.2), A, p.a * (0.45 + settle * 0.55));
          p.px = x; p.py = y;
        }
        const burst = Math.max(0, 1 - t * 5);
        if (burst > 0) blob(CX, CY, scale * 0.2 * burst + 20, WHITE, burst);
        break;
      }

      case 2: {                                     /* energy → matter */
        const cond = smooth(clamp01((t - 0.12) / 0.72));
        for (const p of P) {
          p.ph += 0.02 * p.sp;
          const L = p.len * (1 - cond);
          const dx = Math.cos(p.dir + Math.sin(p.ph) * 0.5);
          const dy = Math.sin(p.dir + Math.sin(p.ph) * 0.5);
          const wob = Math.sin(p.ph * 1.6) * 5 * (1 - cond);
          const x = p.x + dx * wob, y = p.y + dy * wob;
          if (L > 1) {                                       /* energy: a stretched wave */
            const g = ctx.createLinearGradient(x - dx * L / 2, y - dy * L / 2, x + dx * L / 2, y + dy * L / 2);
            g.addColorStop(0, `rgba(${A[0]},${A[1]},${A[2]},0)`);
            g.addColorStop(0.5, `rgba(255,238,214,${p.a * (1 - cond * 0.55)})`);
            g.addColorStop(1, `rgba(${A[0]},${A[1]},${A[2]},0)`);
            ctx.strokeStyle = g;
            ctx.lineWidth = p.sz * 0.9;
            ctx.beginPath();
            ctx.moveTo(x - dx * L / 2, y - dy * L / 2);
            ctx.lineTo(x + dx * L / 2, y + dy * L / 2);
            ctx.stroke();
          }
          if (cond > 0.02) blob(x, y, p.sz * (1.6 + cond * 2.4), A, cond * (0.35 + p.a)); /* matter: a solid grain */
        }
        break;
      }

      case 3: {                                     /* quark soup → nucleons */
        const bind = smooth(clamp01((t - 0.26) / 0.6));
        for (const p of P) {
          if (p.kind === "e") {
            p.x += p.vx * (1 - bind * 0.6); p.y += p.vy * (1 - bind * 0.6);
            if (p.x < 0 || p.x > W) p.vx *= -1;
            if (p.y < 0 || p.y > H) p.vy *= -1;
            blob(p.x, p.y, p.sz * 2.2, [150, 200, 255], 0.55);
          } else {
            p.ph += 0.05 * p.sp;
            const jx = Math.cos(p.ph) * 26 * (1 - bind);
            const jy = Math.sin(p.ph * 1.3) * 26 * (1 - bind);
            const tx = lerp(p.x, p.gx + p.ox, bind);
            const ty = lerp(p.y, p.gy + p.oy, bind);
            const x = tx + jx, y = ty + jy;
            blob(x, y, p.sz * (2 - bind * 0.5), A, 0.75);
            if (p.lead && bind > 0.35) {                    /* the nucleon's binding shell */
              const k = (bind - 0.35) / 0.65;
              ctx.strokeStyle = `rgba(${A[0]},${A[1]},${A[2]},${k * 0.34})`;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.arc(p.gx, p.gy, 13 + Math.sin(p.ph * 0.6) * 1.2, 0, TAU);
              ctx.stroke();
            }
          }
        }
        break;
      }

      case 4: {                                     /* nucleosynthesis */
        for (const p of P) {
          if (p.kind === "h") {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0 || p.x > W) p.vx *= -1;
            if (p.y < 0 || p.y > H) p.vy *= -1;
            p.ph += 0.03;
            blob(p.x, p.y, p.sz * 2.1, A, 0.55 + Math.sin(p.ph) * 0.12);
          } else {
            const k = smooth(clamp01((t - p.at) / 0.16));
            const x = lerp(p.x, p.gx + p.ox, k);
            const y = lerp(p.y, p.gy + p.oy, k);

                const f = 1 - clamp01((fuseAge - 0.85) / 1.05);
                blob(p.gx, p.gy, 14 + 62 * (1 - f), WHITE, f * 0.85);

        const capture = smooth(clamp01((t - 0.30) / 0.22));
        const fog = 1 - smooth(clamp01((t - 0.34) / 0.26));
        const nuclei = P.filter(p => p.kind === "nuc");

        for (const p of P) {
          if (p.kind === "cmb") {                            /* the relic pattern, always faint */
            if (t > 0.62) {
              const k = clamp01((t - 0.62) / 0.38);
              const col = p.warm ? [255, 140, 130] : [120, 150, 255];
              blob(p.x, p.y, p.rad, col, 0.045 * k);
            }
          } else if (p.kind === "nuc") {
            blob(p.x, p.y, p.sz * 2, A, 0.55 + fog * 0.3);
          } else {                                            /* free electrons, then captured */
            if (capture < 1) {
              p.x += p.vx * (1 - capture); p.y += p.vy * (1 - capture);
              if (p.x < 0 || p.x > W) p.vx *= -1;
              if (p.y < 0 || p.y > H) p.vy *= -1;
            }
            const host = nuclei[p.host % nuclei.length];
            const ang = now * 0.004 + p.host;
            const ox = host.x + Math.cos(ang) * 9;
            const oy = host.y + Math.sin(ang) * 9;
            const x = lerp(p.x, ox, capture);
            const y = lerp(p.y, oy, capture);
            blob(x, y, p.sz * 1.9, [170, 210, 255], 0.5 + (1 - capture) * 0.4);
          }
        }

        if (fog > 0.005) {                                    /* the opaque scattering fog */
          ctx.globalCompositeOperation = "source-over";
          ctx.fillStyle = `rgba(${A[0]},${A[1]},${A[2]},${fog * 0.30})`;
          ctx.fillRect(0, 0, W, H);
          ctx.globalCompositeOperation = "lighter";
          for (let k = 0; k < 9; k++) {
            const a2 = now * 0.00012 + k;
            blob(CX + Math.cos(a2) * W * 0.34, CY + Math.sin(a2 * 1.4) * H * 0.34,
                 scale * 0.44, [255, 226, 210], fog * 0.10);
          }
        }

        if (t > 0.48 && t < 0.94) {                           /* first light, released */
          const k = (t - 0.48) / 0.46;
          const rr = easeOut(k) * R * 2.1;
          const al = (1 - k) * 0.55;
          ctx.strokeStyle = `rgba(255,250,242,${al})`;
          ctx.lineWidth = 2 + 26 * (1 - k);
          ctx.beginPath();
          ctx.ellipse(CX, CY, rr, rr * 0.82, 0, 0, TAU);
          ctx.stroke();
          if (k < 0.13) blob(CX, CY, scale * 0.6 * (1 - k / 0.13), WHITE, (1 - k / 0.13) * 0.75);
        }
        break;
      }

      case 6: {                                     /* dark ages */
        for (const p of P) {
          if (p.kind === "gas") {
            p.x += p.vx; p.y += p.vy;
            if (p.x < -p.rad) p.x = W + p.rad;
            if (p.x > W + p.rad) p.x = -p.rad;
            if (p.y < -p.rad) p.y = H + p.rad;
            if (p.y > H + p.rad) p.y = -p.rad;
            p.ph += 0.004;
            blob(p.x, p.y, p.rad * (1 + Math.sin(p.ph) * 0.05), A, p.a * (0.55 + t * 0.45));
          } else {
            p.ph += 0.01;
            blob(p.x, p.y, p.sz * 2, A, p.a * (0.6 + Math.sin(p.ph) * 0.4));
          }
        }
        break;
      }

      case 7: {                                     /* first stars & galaxies */
        for (const p of P) {
          if (p.kind === "cloud") {
            const k = clamp01((t - p.at + 0.25) / 0.5);
            const rad = p.rad * (1 - k * 0.72);
            p.ph += 0.006;
            blob(p.x, p.y, rad, [110, 124, 153], 0.075 * (1 - k * 0.45));
            if (t > p.at) {                                   /* ignition */
              const g = clamp01((t - p.at) / 0.2);
              const core = 1.8 + g * 4.2;
              blob(p.x, p.y, core * 7, A, 0.16 * g);
              blob(p.x, p.y, core * 2.4, A, 0.34 * g);
              blob(p.x, p.y, core, WHITE, 0.95 * g);
              const spike = core * (9 + Math.sin(p.ph * 3) * 1.2) * g;
              ctx.strokeStyle = `rgba(255,250,240,${0.26 * g})`;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(p.x - spike, p.y); ctx.lineTo(p.x + spike, p.y);
              ctx.moveTo(p.x, p.y - spike * 0.62); ctx.lineTo(p.x, p.y + spike * 0.62);
              ctx.stroke();
            }
          } else {
            if (t < p.at) continue;
            const g = clamp01((t - p.at) / 0.18);
            p.ph += 0.03;
            const tw = 0.62 + Math.sin(p.ph) * 0.38;
            blob(p.x, p.y, p.sz * 2.4, A, g * tw * 0.85);
          }
        }
        break;
      }

      case 8: {                                     /* galaxies, and us */
        const fade = smooth(clamp01(t / 0.35));
        for (const p of P) {
          if (p.kind === "fs") {
            p.ph += 0.02;
            blob(p.x, p.y, p.sz * 2, A, p.a * (0.6 + Math.sin(p.ph) * 0.4) * fade);
            continue;
          }
          if (t < p.at) continue;
          const g = clamp01((t - p.at) / 0.3);
          p.rot += p.sp * 0.06;
          /* the expansion is still running, and still speeding up */
          p.x += (p.x - CX) * 0.00016;
          p.y += (p.y - CY) * 0.00016;
          const cos = Math.cos(p.rot), sin = Math.sin(p.rot);
          for (const q of p.pts) {
            const lx = Math.cos(q.th) * q.rr * g;
            const ly = Math.sin(q.th) * q.rr * p.tilt * g;
            blob(p.x + lx * cos - ly * sin, p.y + lx * sin + ly * cos, q.sz * 1.9, A, 0.6 * g);
          }
          blob(p.x, p.y, p.rad * 0.34 * g, A, 0.2 * g);      /* the bulge */
          blob(p.x, p.y, 4.2 * g, WHITE, 0.9 * g);
        }
        break;
      }
    }

    ctx.globalCompositeOperation = "source-over";
  }

  /* ============================ sequencer ============================ */

  const copyEl   = document.getElementById("copy");
  const railEl   = document.getElementById("rail");
  const playBtn  = document.getElementById("playBtn");
  const replayBtn= document.getElementById("replayBtn");
  const elapsedEl= document.getElementById("elapsed");
  const tTime    = document.getElementById("tTime");
  const tTemp    = document.getElementById("tTemp");
  const tState   = document.getElementById("tState");

  let stage = -1;
  let stageStart = 0;
  let playing = true;
  let outFired = false;
  let raf = 0;

  /* build the rail once */
  railEl.style.setProperty("--n", STAGES.length);
  const nodes = STAGES.map((s, i) => {
    const b = document.createElement("button");
    b.className = "node";
    b.type = "button";
    b.innerHTML = `<span class="nn">${s.n}</span><span class="nl">${s.label}</span>`;
    b.setAttribute("aria-label", `Stage ${s.n}: ${s.name}`);
    b.addEventListener("click", () => {          /* jumping to a stage means you want to watch it */
      playing = true;
      playBtn.textContent = "Pause";
      go(i);
    });
    railEl.appendChild(b);
    return b;
  });

  function paintCopy(s) {
    const y = s.yield
      ? `<ul class="yield">${s.yield.map(([el, amt]) =>
          `<li><span class="el">${el}</span><span class="amt">${amt}</span></li>`).join("")}</ul>`
      : "";
    const d = s.deep
      ? `<button class="more" type="button" aria-expanded="false" aria-controls="deep">` +
          `<span class="chev" aria-hidden="true"></span><span class="more-l">Read more</span>` +
        `</button>` +
        `<div class="deep" id="deep" hidden>${s.deep}</div>`
      : "";
    hideTip();
    copyEl.className = "copy";
    copyEl.scrollTop = 0;
    copyEl.innerHTML =
      `<div class="eyebrow"><span class="idx">${s.n}</span><span class="bar"></span><span>${s.time}</span></div>` +
      `<h2 class="title">${s.name}</h2>` +
      `<p class="lede">${s.body}</p>` + y + d;
    requestAnimationFrame(() => requestAnimationFrame(() => copyEl.classList.add("in")));
  }

  /* ---- glossary tooltip: rendered on <body> so the scrolling copy can't clip it ---- */

  const tip = document.createElement("div");
  tip.className = "tip";
  tip.setAttribute("role", "tooltip");
  document.body.appendChild(tip);

  function showTip(el) {
    const def = GLOSSARY[el.dataset.g];
    if (!def) return;
    tip.textContent = def;
    tip.classList.add("on");
    const r = el.getBoundingClientRect();
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let L = r.left + r.width / 2 - w / 2;
    L = Math.max(12, Math.min(L, window.innerWidth - w - 12));
    let T = r.top - h - 10;
    if (T < 12) T = r.bottom + 10;                 /* flip below when there's no room above */
    tip.style.left = L + "px";
    tip.style.top = T + "px";
  }
  function hideTip() { tip.classList.remove("on"); }

  copyEl.addEventListener("mouseover", e => {
    const t = e.target.closest(".term");
    if (t) showTip(t);
  });
  copyEl.addEventListener("mouseout", e => {
    if (e.target.closest(".term")) hideTip();
  });
  copyEl.addEventListener("focusin", e => {
    const t = e.target.closest(".term");
    if (t) showTip(t);
  });
  copyEl.addEventListener("focusout", e => {
    if (e.target.closest(".term")) hideTip();
  });
  /* capture, because scroll doesn't bubble up from the deep panel */
  copyEl.addEventListener("scroll", hideTip, { capture: true, passive: true });
  window.addEventListener("scroll", hideTip, { passive: true });

  /* ---- deep-dive disclosure: opening pauses so the sequence can't advance mid-read ---- */

  let wasPlaying = true;

  copyEl.addEventListener("click", e => {
    const term = e.target.closest(".term");
    if (term) {                                    /* tap-to-define on touch devices */
      if (tip.classList.contains("on")) hideTip(); else showTip(term);
      return;
    }
    const btn = e.target.closest(".more");
    if (!btn) return;

    const panel = copyEl.querySelector(".deep");
    const open = btn.getAttribute("aria-expanded") === "true";

    if (open) {
      btn.setAttribute("aria-expanded", "false");
      panel.hidden = true;
      copyEl.classList.remove("reading");
      btn.querySelector(".more-l").textContent = "Read more";
      if (wasPlaying) { playing = true; playBtn.textContent = "Pause"; }
    } else {
      wasPlaying = playing;
      playing = false;
      playBtn.textContent = "Play";
      btn.setAttribute("aria-expanded", "true");
      panel.hidden = false;
      copyEl.classList.add("reading");
      btn.querySelector(".more-l").textContent = "Close";
    }
  });

  function go(i) {
    stage = i;
    const s = STAGES[i];
    stageStart = performance.now();
    outFired = false;

    document.documentElement.style.setProperty("--accent", s.accent);
    tTime.textContent  = s.time;
    tTemp.textContent  = s.temp;
    tState.textContent = s.state;
    elapsedEl.textContent = `Stage ${i + 1} / ${STAGES.length}`;

    nodes.forEach((n, k) => {
      n.classList.toggle("active", k === i);
      n.classList.toggle("done", k < i);
      n.querySelector(".nn").style.opacity = k <= i ? "1" : ".55";
    });

    paintCopy(s);
    initSim(i);
    if (REDUCED) render(s.sim, 0.7, performance.now());   /* one held frame, no churn */
  }

  function tick(now) {
    raf = requestAnimationFrame(tick);
    const s = STAGES[stage];
    const t = clamp01((now - stageStart) / s.dur);

    if (!REDUCED) render(s.sim, t, now);

    setFill(stage, t);

    const isLast = stage === STAGES.length - 1;

    if (playing) {
      /* the closing stage keeps its text — there is nothing to hand off to */
      if (t > 0.93 && !outFired && !isLast) { copyEl.classList.add("out"); outFired = true; }
      if (t >= 1) {
        if (!isLast) go(stage + 1);
        else { playing = false; playBtn.textContent = "Play"; nodes[stage].classList.add("done"); }
      }
    } else if (t >= 1) {
      stageStart = now - s.dur;   /* hold at the end of the stage while paused */
    }
  }

  /* the active node's progress fill (::after width can't be set inline, so use a CSS var proxy) */
  const fillStyle = document.createElement("style");
  document.head ? document.head.appendChild(fillStyle) : document.body.appendChild(fillStyle);
  function setFill(i, t) {
    fillStyle.textContent = `.node:nth-child(${i + 1})::after{width:${(t * 100).toFixed(1)}%}`;
  }

  playBtn.addEventListener("click", () => {
    if (!playing && stage === STAGES.length - 1 &&
        (performance.now() - stageStart) / STAGES[stage].dur >= 1) {
      go(0); playing = true; playBtn.textContent = "Pause"; return;
    }
    playing = !playing;
    playBtn.textContent = playing ? "Pause" : "Play";
    /* paused mid-fade: bring the text back so it can still be read */
    if (!playing && outFired) {
      copyEl.classList.remove("out");
      outFired = false;
      stageStart = performance.now() - STAGES[stage].dur * 0.90;
    }
  });

  replayBtn.addEventListener("click", () => {
    playing = true;
    playBtn.textContent = "Pause";
    go(0);
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { hideTip(); return; }
    /* don't hijack space while a button has focus — it should activate that button */
    const onButton = e.target instanceof Element && e.target.closest("button");
    if (e.key === " " && !onButton) { e.preventDefault(); playBtn.click(); }
    else if (e.key === "ArrowRight" && stage < STAGES.length - 1) go(stage + 1);
    else if (e.key === "ArrowLeft" && stage > 0) go(stage - 1);
  });

  window.addEventListener("resize", resize);

  resize();
  go(0);
  raf = requestAnimationFrame(tick);
})();
</script>
</body>
</html>
